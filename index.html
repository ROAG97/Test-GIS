<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Leaflet – Punkter med popup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin:0; height:100%; }
    #map { width: 100%; height: 100vh; }
    .popup-content img {
      width: 150px;
      display: block;
      margin-bottom: 5px;
    }
    .popup-content b {
      color: #2a2a2a;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

const map = L.map("map").setView([56.0465, 12.6945], 10);

const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { attribution: "© OpenStreetMap" }
);

const esriSat = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { attribution: "Tiles © Esri" }
);

const ortho = L.tileLayer("tiles_ortho/{z}/{x}/{y}.jpg", {
  attribution: "© Robert Agnarp",
  minZoom: 16,
  maxZoom: 23,
  opacity: 0.7,
  zIndex: 100
});

osm.addTo(map);

//L.control.layers(
  //{
    //"OpenStreetMap": osm,
    //"Satellit (ESRI)": esriSat
  //},
  //{
    //"Ortofoto (overlay)": ortho
  //},
  //{ collapsed: false }
//).addTo(map);

// ================================
// LFV DRÖNARRESTRIKTIONER
// ================================

const lfvNoFlyLayer = L.layerGroup();
const lfvRestrictedLayer = L.layerGroup();

const draktanderRivenLayer = L.layerGroup();
const draktanderKvarLayer = L.layerGroup();

L.control.layers(
  {
    "OpenStreetMap": osm,
    "Satellit (ESRI)": esriSat
  },
  {
    "Ortofoto (overlay)": ortho,
    "🔴 Drönare – tillstånd krävs": lfvNoFlyLayer,
    "🟠 Drönare – begränsad": lfvRestrictedLayer,

    "🔴 Draktänder – rivna": draktanderRivenLayer,
    "🟢 Draktänder – kvar": draktanderKvarLayer,

  },
  { collapsed: false }
).addTo(map);

fetch("data/lfv_dronarkarta.geojson")
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    return res.json();
  })
  .then(data => {

    L.geoJSON(data, {

      style: function(feature) {

        const farg = feature.properties?.Färg;

        if (farg === "RÖD") {
          return {
            color: "#d00000",
            weight: 3,
            fillColor: "#d00000",
            fillOpacity: 0.08
          };
        }

        if (farg === "ORANGE") {
          return {
            color: "#ff8800",
            weight: 3,
            fillColor: "#ff8800",
            fillOpacity: 0.08
          };
        }

        return {
          color: "#888888",
          weight: 2,
          fillOpacity: 0
        };
      },

      onEachFeature: function(feature, layer) {

        const p = feature.properties || {};

        const popup = `
          <div class="popup-content">
            <b>Område:</b> ${p.NAMEOFAREA || "-"}<br>
            <b>Typ:</b> ${p.TYPEOFAREA || "-"}<br>
            <b>Plats:</b> ${p.LOCATION || "-"}<br>
            <b>Undre gräns:</b> ${p.LOWER || "-"}<br>
            <b>Övre gräns:</b> ${p.UPPER || "-"}<br>
            <b>Gäller från:</b> ${p.WEF || "-"}<br>
            <b>Klass:</b> ${p.Färg || "-"}
          </div>
        `;

        layer.bindPopup(popup);

        if (p.Färg === "RÖD") {
          lfvNoFlyLayer.addLayer(layer);
        }

        if (p.Färg === "ORANGE") {
          lfvRestrictedLayer.addLayer(layer);
        }
      }

    });

    // Rött lager på från början
    lfvNoFlyLayer.addTo(map);

    console.log("LFV GeoJSON laddat:", data.features.length, "features");

  })
  .catch(err => {
    console.error("Misslyckades med att ladda LFV GeoJSON:", err);
  });

// ================================
// DRAKTÄNDER
// ================================

fetch("data/draktander.geojson")
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    return res.json();
  })
  .then(data => {

    L.geoJSON(data, {

      style: function(feature) {

        const status = feature.properties?.STATUS;

        if (status === "RIVET") {
          return {
            color: "#ff0000",
            weight: 5,
            opacity: 1
          };
        }

        if (status === "KVAR") {
          return {
            color: "#00a000",
            weight: 5,
            opacity: 1
          };
        }

        return {
          color: "#888888",
          weight: 4,
          opacity: 1
        };
      },

      if (status === "BEVARAD") {
      return {
      color: "#ff8800",
      weight: 5,
      opacity: 1
      };
      }

      onEachFeature: function(feature, layer) {

        const p = feature.properties || {};

        const popup = `
          <div class="popup-content">
            <b>Status:</b> ${p.STATUS || "-"}<br>
            <b>ID:</b> ${p.id || "-"}<br>
          </div>
        `;

        layer.bindPopup(popup);

        if (p.STATUS === "RIVET") {
          draktanderRivenLayer.addLayer(layer);
        }

        if (p.STATUS === "KVAR") {
          draktanderKvarLayer.addLayer(layer);
        }
      }

    });

    console.log(
      "Draktänder laddade:",
      data.features.length,
      "features"
    );

  })
  .catch(err => {
    console.error("Misslyckades med att ladda Draktänder GeoJSON:", err);
  });

// ===============================
// Bunker punkter
// ===============================

fetch("data/BunkerLayer.geojson")
  .then(res => {
    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }
    return res.json();
  })
  .then(data => {

    const layer = L.geoJSON(data, {

      pointToLayer: (feature, latlng) => {
        return L.marker(latlng);
      },

      onEachFeature: (feature, layer) => {

        const p = feature.properties || {};

        const hasImage =
          p.Bild && p.Bild !== "-" && p.Bild.trim() !== "";

        const hasModel =
          p.Modell && p.Modell !== "-" && p.Modell.trim() !== "";

        const popup = `
          <div class="popup-content">

            <b>Typ:</b> ${p.Typ || ""}<br>
            <b>Nr:</b> ${p.Nr || ""}<br>
            <b>Tillgänglighet:</b> ${p["Tillgänglighet"] || ""}<br>
            <b>Parkering:</b> ${p.Parkering || ""}<br>
            <b>Mindre kuriosa:</b> ${p["Mindre kuriosa"] || ""}<br>
            <b>Status:</b> ${p.Status || ""}<br>
            <b>Plomberad:</b> ${p.Plomberad || ""}<br>

            ${
              hasImage
                ? `
                  <a href="${p.Bild}" target="_blank">
                    <img
                      src="${p.Bild}"
                      alt="Bild ${p.Nr || ""}"
                      style="width:280px;height:auto;border-radius:6px;cursor:zoom-in;"
                    >
                  </a><br>
                `
                : `<i>📷 Bild saknas</i><br>`
            }

            ${
              hasModel
                ? `<br>
                   <a href="${p.Modell}" target="_blank">
                     🔗 Visa 3D-modell
                   </a>`
                : ""
            }

          </div>
        `;

        layer.bindPopup(popup, {
          maxWidth: 400,
          minWidth: 350
        });
      }

    }).addTo(map);

  })
  .catch(err => {
    console.error("Misslyckades med att ladda Bunker GeoJSON:", err);
  });

if (navigator.geolocation) {
  navigator.geolocation.watchPosition(
    function(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      L.circleMarker([lat, lng], {
        radius: 8,
        color: '#ff8800',
        fillColor: '#ff8800',
        fillOpacity: 0.9
      })
      .addTo(map)
      .bindPopup(`Din position:<br>Lat: ${lat.toFixed(6)}, Lng: ${lng.toFixed(6)}`);
    },
    function(error) {
      console.warn("Geolocation misslyckades:", error.message);
    },
    {
      enableHighAccuracy: true,
      maximumAge: 10000,
      timeout: 5000
    }
  );
}

</script>

</body>
</html>
