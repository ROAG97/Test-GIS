<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Leaflet – Bunkerkarta</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .popup-content img {
      width: 150px;
      display: block;
      margin-bottom: 5px;
    }

    .popup-content b {
      color: #2a2a2a;
    }

    /* ================================
       EGEN FILTERMENY
       ================================ */

    .filter-control {
      position: relative;
      z-index: 1000;
    }

    .filter-button {
      background: white;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 5px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 1px 5px rgba(0,0,0,0.25);
    }

    .filter-menu {
      display: none;
      background: white;
      padding: 10px;
      margin-top: 5px;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);

      width: 260px;
      max-height: 80vh;
      overflow-y: auto;
    }

    .filter-menu.open {
      display: block;
    }

    .filter-section-title {
      font-weight: bold;
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 5px;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 4px 2px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter-option input {
      cursor: pointer;
      flex-shrink: 0;
    }

    .filter-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .filter-divider {
      border: 0;
      border-top: 1px solid #999;
      margin: 10px 0;
    }

    .filter-status-color {
      width: 18px;
      height: 4px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .red {
      background: #ff0000;
    }

    .green {
      background: #00a000;
    }

    .orange {
      background: #ff8800;
    }

    .gray {
      background: #777777;
    }

    /* Mobil */
    @media (max-width: 600px) {

      .filter-menu {
        width: calc(100vw - 40px);
        max-width: 320px;
        max-height: 75vh;
      }

      .filter-button {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map("map").setView([56.0465, 12.6945], 10);


// ================================
// KARTUNDERLAG
// ================================

const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenStreetMap"
  }
);

const esriSat = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    attribution: "Tiles © Esri"
  }
);

const ortho = L.tileLayer(
  "tiles_ortho/{z}/{x}/{y}.jpg",
  {
    attribution: "© Robert Agnarp",
    minZoom: 16,
    maxZoom: 23,
    opacity: 0.7,
    zIndex: 100
  }
);

osm.addTo(map);


// ================================
// LAGER
// ================================

// Drönare

const lfvNoFlyLayer = L.layerGroup();
const lfvRestrictedLayer = L.layerGroup();


// Draktänder / värn

const draktanderRivenLayer = L.layerGroup();
const draktanderKvarLayer = L.layerGroup();
const draktanderBevaradLayer = L.layerGroup();
const draktanderOkandLayer = L.layerGroup();


// Bunkertyper

const bunkerTypeLayers = {};


// ================================
// SVG-IKONER
// ================================

const bunkerIcons = {

  "Observationsvärn": L.icon({
    iconUrl: "icons/Observationsvärn.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "Skyddsrum": L.icon({
    iconUrl: "icons/SKYDDSRUM.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "KG": L.icon({
    iconUrl: "icons/KG.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "PV": L.icon({
    iconUrl: "icons/PV.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "KSP": L.icon({
    iconUrl: "icons/QGIS.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "KSP I": L.icon({
    iconUrl: "icons/KSPI.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "KSP II": L.icon({
    iconUrl: "icons/KSPII.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "KSP III": L.icon({
    iconUrl: "icons/KSPIII.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "KSP IV": L.icon({
    iconUrl: "icons/KSPIV.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  }),

  "KSP V": L.icon({
    iconUrl: "icons/KSPV.svg",
    iconSize: [32, 32],
    iconAnchor: [16, 16],
    popupAnchor: [0, -16]
  })

};


// ================================
// EGEN KARTKONTROLL
// ================================

const FilterControl = L.Control.extend({

  options: {
    position: "topright"
  },

  onAdd: function() {

    const container = L.DomUtil.create(
      "div",
      "filter-control"
    );

    L.DomEvent.disableClickPropagation(container);

    container.innerHTML = `

      <button class="filter-button">
        ☰ Karta
      </button>

      <div class="filter-menu">

        <!-- =========================
             KARTUNDERLAG
             ========================= -->

        <div class="filter-section-title">
          Kartunderlag
        </div>

        <label class="filter-option">
          <input type="radio"
                 name="basemap"
                 value="osm"
                 checked>
          OpenStreetMap
        </label>

        <label class="filter-option">
          <input type="radio"
                 name="basemap"
                 value="satellite">
          Satellit (ESRI)
        </label>

        <label class="filter-option">
          <input type="checkbox"
                 id="orthoToggle">
          Ortofoto
        </label>


        <!-- =========================
             DRÖNARRESTRIKTIONER
             ========================= -->

        <hr class="filter-divider">

        <div class="filter-section-title">
          Drönarrestriktioner
        </div>

        <label class="filter-option">
          <input type="checkbox"
                 id="lfvNoFly">
          <span class="filter-status-color red"></span>
          Tillstånd krävs
        </label>

        <label class="filter-option">
          <input type="checkbox"
                 id="lfvRestricted">
          <span class="filter-status-color orange"></span>
          Begränsad
        </label>


        <!-- =========================
             BUNKERTYPER
             ========================= -->

        <hr class="filter-divider">

        <div class="filter-section-title">
          Bunkertyper
        </div>

        <div id="bunkerFilters"></div>


        <!-- =========================
             VÄRN / DRAKTÄNDER
             ========================= -->

        <hr class="filter-divider">

        <div class="filter-section-title">
          Värn / draktänder
        </div>

        <label class="filter-option">
          <input type="checkbox"
                 id="draktanderRiven">
          <span class="filter-status-color red"></span>
          Rivna
        </label>

        <label class="filter-option">
          <input type="checkbox"
                 id="draktanderKvar">
          <span class="filter-status-color green"></span>
          Kvar
        </label>

        <label class="filter-option">
          <input type="checkbox"
                 id="draktanderBevarad">
          <span class="filter-status-color orange"></span>
          Bevarade / flyttade
        </label>

        <label class="filter-option">
          <input type="checkbox"
                 id="draktanderOkand">
          <span class="filter-status-color gray"></span>
          Okända
        </label>

      </div>
    `;


    // ================================
    // ÖPPNA / STÄNG MENY
    // ================================

    const button =
      container.querySelector(".filter-button");

    const menu =
      container.querySelector(".filter-menu");

    button.addEventListener("click", function() {

      menu.classList.toggle("open");

    });


    // ================================
    // KARTUNDERLAG
    // ================================

    container
      .querySelectorAll('input[name="basemap"]')
      .forEach(input => {

        input.addEventListener("change", function() {

          if (this.value === "osm") {

            map.removeLayer(esriSat);
            osm.addTo(map);

          }

          if (this.value === "satellite") {

            map.removeLayer(osm);
            esriSat.addTo(map);

          }

        });

      });


    // Ortofoto

    container
      .querySelector("#orthoToggle")
      .addEventListener("change", function() {

        if (this.checked) {
          ortho.addTo(map);
        } else {
          map.removeLayer(ortho);
        }

      });


    // ================================
    // DRÖNARRESTRIKTIONER
    // ================================

    container
      .querySelector("#lfvNoFly")
      .addEventListener("change", function() {

        if (this.checked) {
          lfvNoFlyLayer.addTo(map);
        } else {
          map.removeLayer(lfvNoFlyLayer);
        }

      });


    container
      .querySelector("#lfvRestricted")
      .addEventListener("change", function() {

        if (this.checked) {
          lfvRestrictedLayer.addTo(map);
        } else {
          map.removeLayer(lfvRestrictedLayer);
        }

      });


    // ================================
    // DRAKTÄNDER
    // ================================

    container
      .querySelector("#draktanderRiven")
      .addEventListener("change", function() {

        if (this.checked) {
          draktanderRivenLayer.addTo(map);
        } else {
          map.removeLayer(draktanderRivenLayer);
        }

      });


    container
      .querySelector("#draktanderKvar")
      .addEventListener("change", function() {

        if (this.checked) {
          draktanderKvarLayer.addTo(map);
        } else {
          map.removeLayer(draktanderKvarLayer);
        }

      });


    container
      .querySelector("#draktanderBevarad")
      .addEventListener("change", function() {

        if (this.checked) {
          draktanderBevaradLayer.addTo(map);
        } else {
          map.removeLayer(draktanderBevaradLayer);
        }

      });


    container
      .querySelector("#draktanderOkand")
      .addEventListener("change", function() {

        if (this.checked) {
          draktanderOkandLayer.addTo(map);
        } else {
          map.removeLayer(draktanderOkandLayer);
        }

      });


    return container;
  }

});

map.addControl(
  new FilterControl()
);


// ================================
// LFV DRÖNARKARTA
// ================================

fetch("data/lfv_dronarkarta.geojson")
  .then(res => {

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    return res.json();

  })

  .then(data => {

    L.geoJSON(data, {

      style: function(feature) {

        const farg =
          feature.properties?.Färg;

        if (farg === "RÖD") {

          return {
            color: "#d00000",
            weight: 3,
            fillColor: "#d00000",
            fillOpacity: 0.08
          };

        }

        if (farg === "ORANGE") {

          return {
            color: "#ff8800",
            weight: 3,
            fillColor: "#ff8800",
            fillOpacity: 0.08
          };

        }

        return {
          color: "#888888",
          weight: 2,
          fillOpacity: 0
        };

      },

      onEachFeature:
        function(feature, layer) {

          const p =
            feature.properties || {};

          const popup = `

            <div class="popup-content">

              <b>Område:</b>
              ${p.NAMEOFAREA || "-"}<br>

              <b>Typ:</b>
              ${p.TYPEOFAREA || "-"}<br>

              <b>Plats:</b>
              ${p.LOCATION || "-"}<br>

              <b>Undre gräns:</b>
              ${p.LOWER || "-"}<br>

              <b>Övre gräns:</b>
              ${p.UPPER || "-"}<br>

              <b>Gäller från:</b>
              ${p.WEF || "-"}<br>

              <b>Klass:</b>
              ${p.Färg || "-"}

            </div>

          `;

          layer.bindPopup(popup);


          if (p.Färg === "RÖD") {

            lfvNoFlyLayer
              .addLayer(layer);

          }

          if (p.Färg === "ORANGE") {

            lfvRestrictedLayer
              .addLayer(layer);

          }

        }

    });

  })

  .catch(err => {

    console.error(
      "Misslyckades med LFV:",
      err
    );

  });


// ================================
// DRAKTÄNDER
// ================================

fetch("data/draktander.geojson")
  .then(res => {

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    return res.json();

  })

  .then(data => {

    L.geoJSON(data, {

      style: function(feature) {

        const status =
          feature.properties?.STATUS;

        if (status === "RIVET") {

          return {
            color: "#ff0000",
            weight: 5,
            opacity: 1
          };

        }

        if (status === "KVAR") {

          return {
            color: "#00a000",
            weight: 5,
            opacity: 1
          };

        }

        if (status === "BEVARAD") {

          return {
            color: "#ff8800",
            weight: 5,
            opacity: 1
          };

        }

        return {
          color: "#777777",
          weight: 5,
          opacity: 1
        };

      },


      onEachFeature:
        function(feature, layer) {

          const p =
            feature.properties || {};

          const popup = `

            <div class="popup-content">

              <b>Status:</b>
              ${p.STATUS || "-"}<br>

              <b>ID:</b>
              ${p.id || "-"}

            </div>

          `;

          layer.bindPopup(popup);


          if (p.STATUS === "RIVET") {

            draktanderRivenLayer
              .addLayer(layer);

          }

          if (p.STATUS === "KVAR") {

            draktanderKvarLayer
              .addLayer(layer);

          }

          if (p.STATUS === "BEVARAD") {

            draktanderBevaradLayer
              .addLayer(layer);

          }

          if (
            !p.STATUS ||
            p.STATUS === "OKAND"
          ) {

            draktanderOkandLayer
              .addLayer(layer);

          }

        }

    });

  })

  .catch(err => {

    console.error(
      "Misslyckades med Draktänder:",
      err
    );

  });


// ================================
// BUNKERLAGER
// ================================

fetch("data/BunkerLayer.geojson")
  .then(res => {

    if (!res.ok) {
      throw new Error(`HTTP ${res.status}`);
    }

    return res.json();

  })

  .then(data => {

    L.geoJSON(data, {

      pointToLayer:
        function(feature, latlng) {

          const typ =
            feature.properties?.Typ;

          const icon =
            bunkerIcons[typ];

          const marker =
            icon
              ? L.marker(latlng, {
                  icon: icon
                })
              : L.marker(latlng);


          // Skapa lager för typen

          if (!bunkerTypeLayers[typ]) {

            bunkerTypeLayers[typ] =
              L.layerGroup();

          }

          bunkerTypeLayers[typ]
            .addLayer(marker);


          return marker;

        },


      onEachFeature:
        function(feature, layer) {

          const p =
            feature.properties || {};

          const hasImage =
            p.Bild &&
            p.Bild !== "-" &&
            p.Bild.trim() !== "";

          const hasModel =
            p.Modell &&
            p.Modell !== "-" &&
            p.Modell.trim() !== "";


          const popup = `

            <div class="popup-content">

              <b>Typ:</b>
              ${p.Typ || ""}<br>

              <b>Nr:</b>
              ${p.Nr || ""}<br>

              <b>Tillgänglighet:</b>
              ${p["Tillgänglighet"] || ""}<br>

              <b>Parkering:</b>
              ${p.Parkering || ""}<br>

              <b>Mindre kuriosa:</b>
              ${p["Mindre kuriosa"] || ""}<br>

              <b>Status:</b>
              ${p.Status || ""}<br>

              <b>Plomberad:</b>
              ${p.Plomberad || ""}<br>

              <b>Besökt:</b>
              ${p["Besökt"] || ""}<br>

              <b>Övrigt:</b>
              ${p["Övrigt"] || ""}<br>


              ${
                hasImage
                ?

                `

                  <a href="${p.Bild}"
                     target="_blank">

                    <img
                      src="${p.Bild}"
                      alt="Bild ${p.Nr || ""}"
                      style="
                        width:280px;
                        height:auto;
                        border-radius:6px;
                        cursor:zoom-in;
                      "
                    >

                  </a>

                  <br>

                `

                :

                `<i>📷 Bild saknas</i><br>`

              }


              ${
                hasModel
                ?

                `

                  <br>

                  <a href="${p.Modell}"
                     target="_blank">

                    🔗 Visa 3D-modell

                  </a>

                `

                :

                ""

              }

            </div>

          `;


          layer.bindPopup(popup, {

            maxWidth: 400,
            minWidth: 350

          });

        }

    });


    // ================================
    // SKAPA FILTER FÖR BUNKERTYPER
    // ================================

    const bunkerFilterContainer =
      document.querySelector(
        "#bunkerFilters"
      );


    Object.keys(bunkerTypeLayers)
      .sort()
      .forEach(typ => {

        const layer =
          bunkerTypeLayers[typ];


        // Alla bunkertyper PÅ från början

        layer.addTo(map);


        const icon =
          bunkerIcons[typ];


        const iconHTML =
          icon

          ?

          `

            <img
              src="icons/${getIconFilename(typ)}"
              class="filter-icon"
            >

          `

          :

          "";


        const label =
          document.createElement("label");

        label.className =
          "filter-option";


        label.innerHTML = `

          <input
            type="checkbox"
            checked
          >

          ${iconHTML}

          <span>${typ}</span>

        `;


        const checkbox =
          label.querySelector("input");


        checkbox.addEventListener(
          "change",
          function() {

            if (this.checked) {

              layer.addTo(map);

            } else {

              map.removeLayer(layer);

            }

          }
        );


        bunkerFilterContainer
          .appendChild(label);

      });

  })

  .catch(err => {

    console.error(
      "Misslyckades med BunkerLayer:",
      err
    );

  });


// ================================
// HJÄLPFUNKTION FÖR SVG-FILNAMN
// ================================

function getIconFilename(typ) {

  const filenames = {

    "Observationsvärn":
      "Observationsvärn.svg",

    "Skyddsrum":
      "SKYDDSRUM.svg",

    "KG":
      "KG.svg",

    "PV":
      "PV.svg",

    "KSP":
      "QGIS.svg",

    "KSP I":
      "KSPI.svg",

    "KSP II":
      "KSPII.svg",

    "KSP III":
      "KSPIII.svg",

    "KSP IV":
      "KSPIV.svg",

    "KSP V":
      "KSPV.svg"

  };

  return filenames[typ] || "";

}


// ================================
// GPS
// ================================

if (navigator.geolocation) {

  navigator.geolocation.watchPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      L.circleMarker(
        [lat, lng],
        {

          radius: 8,

          color: "#ff8800",

          fillColor: "#ff8800",

          fillOpacity: 0.9

        }

      )

      .addTo(map)

      .bindPopup(`

        Din position:<br>

        Lat:
        ${lat.toFixed(6)}<br>

        Lng:
        ${lng.toFixed(6)}

      `);

    },


    function(error) {

      console.warn(
        "Geolocation misslyckades:",
        error.message
      );

    },


    {

      enableHighAccuracy: true,

      maximumAge: 10000,

      timeout: 5000

    }

  );

}

</script>

</body>
</html>
