<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <title>Skånes kustförsvarsanläggningar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .popup-content img {
      width: 150px;
      display: block;
      margin-bottom: 5px;
    }

    .popup-content b {
      color: #2a2a2a;
    }

    /* =================================
       EGEN FILTERMENY
       ================================= */

    .filter-control {
      background: white;
      border-radius: 5px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      font-family: Arial, sans-serif;
      font-size: 14px;
      max-width: 320px;
    }

    .filter-header {
      padding: 10px 12px;
      cursor: pointer;
      font-weight: bold;
      user-select: none;
      background: white;
      border-radius: 5px;
    }

    .filter-header:hover {
      background: #f2f2f2;
    }

    .filter-body {
      display: none;
      padding: 6px 10px 10px 10px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .filter-section {
      margin-bottom: 8px;
    }

    .filter-section-title {
      font-weight: bold;
      padding: 7px 4px;
      cursor: pointer;
      user-select: none;
    }

    .filter-section-content {
      display: none;
      padding: 2px 4px 7px 4px;
    }

    .filter-section.open .filter-section-content {
      display: block;
    }

    .filter-option {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      cursor: pointer;
    }

    .filter-option input {
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .filter-option img {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .filter-divider {
      border-top: 1px solid #999;
      margin: 8px 0;
    }

    .filter-subtitle {
      font-weight: bold;
      font-size: 13px;
      margin: 6px 0;
    }

    @media (max-width: 600px) {
      .filter-control {
        max-width: 280px;
      }

      .filter-body {
        max-height: 60vh;
      }
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================================================
   KARTA
   ========================================================= */

const map = L.map("map").setView([56.0465, 12.6945], 10);


/* =========================================================
   KARTUNDERLAG
   ========================================================= */

const osm = L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    attribution: "© OpenStreetMap"
  }
);

const esriSat = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    attribution: "Tiles © Esri"
  }
);

const ortho = L.tileLayer(
  "tiles_ortho/{z}/{x}/{y}.jpg",
  {
    attribution: "© Robert Agnarp",
    minZoom: 16,
    maxZoom: 23,
    opacity: 0.7,
    zIndex: 100
  }
);

osm.addTo(map);


/* =========================================================
   LAGER
   ========================================================= */

const lfvNoFlyLayer = L.layerGroup();
const lfvRestrictedLayer = L.layerGroup();

const draktanderRivenLayer = L.layerGroup();
const draktanderKvarLayer = L.layerGroup();
const draktanderBevaradLayer = L.layerGroup();


/* =========================================================
   DRAKTÄNDER
   ========================================================= */

fetch("data/draktander.geojson")
.then(res => {

  if (!res.ok) {
    throw new Error(`HTTP ${res.status}`);
  }

  return res.json();

})
.then(data => {

  L.geoJSON(data, {

    style: function(feature) {

      const status =
        feature.properties?.STATUS;

      if (status === "RIVET") {
        return {
          color: "#ff0000",
          weight: 5,
          opacity: 1
        };
      }

      if (status === "KVAR") {
        return {
          color: "#00a000",
          weight: 5,
          opacity: 1
        };
      }

      if (status === "BEVARAD") {
        return {
          color: "#ff8800",
          weight: 5,
          opacity: 1
        };
      }

      return {
        color: "#888888",
        weight: 4,
        opacity: 1
      };
    },

    onEachFeature: function(feature, layer) {

      const p =
        feature.properties || {};

      const popup = `
        <div class="popup-content">

          <b>Status:</b>
          ${p.STATUS || "-"}
          <br>

          <b>ID:</b>
          ${p.id || "-"}
          <br>

        </div>
      `;

      layer.bindPopup(popup);


      if (p.STATUS === "RIVET") {
        draktanderRivenLayer.addLayer(layer);
      }

      if (p.STATUS === "KVAR") {
        draktanderKvarLayer.addLayer(layer);
      }

      if (p.STATUS === "BEVARAD") {
        draktanderBevaradLayer.addLayer(layer);
      }

    }

  });

  console.log(
    "Draktänder laddade:",
    data.features.length,
    "features"
  );

})
.catch(err => {

  console.error(
    "Misslyckades med att ladda Draktänder:",
    err
  );

});


/* =========================================================
   BUNKERIKONER
   ========================================================= */

const bunkerIcons = {

  "Observationsvärn": L.icon({
    iconUrl: "icons/Observationsvärn.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "Skyddsrum": L.icon({
    iconUrl: "icons/SKYDDSRUM.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "KG": L.icon({
    iconUrl: "icons/KG.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "PV": L.icon({
    iconUrl: "icons/PV.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "KSP": L.icon({
    iconUrl: "icons/QGIS.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "KSP I": L.icon({
    iconUrl: "icons/KSPI.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "KSP II": L.icon({
    iconUrl: "icons/KSPII.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "KSP III": L.icon({
    iconUrl: "icons/KSPIII.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "KSP IV": L.icon({
    iconUrl: "icons/KSPIV.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  }),

  "KSP V": L.icon({
    iconUrl: "icons/KSPV.svg",
    iconSize: [32,32],
    iconAnchor: [16,16],
    popupAnchor: [0,-16]
  })

};


/* =========================================================
   BUNKERFILTER
   ========================================================= */

const bunkerTypeVisibility = {};

let rivnaVisible = false;
let provisoriskaVisible = false;
let okandaVisible = false;

const bunkerFeatures = [];

let bunkerDataLoaded = false;


/* =========================================================
   BESTÄM OM EN BUNKER SKA VISAS
   ========================================================= */

function shouldShowBunker(feature) {

  const p = feature.properties || {};

  const typ = p.Typ || "";

  /*
     Vi använder Status som huvudfält.
     Om det saknas används STATUS också.
  */

  const status = String(
    p.Status ?? p.STATUS ?? ""
  )
    .trim()
    .toUpperCase();


  // ================================
  // STATUS SOM ÖVERSTYR BUNKERTYP
  // ================================

  if (status === "RIVET") {
    return rivnaVisible;
  }

  if (status === "PROVISORISKT") {
    return provisoriskaVisible;
  }

  if (status === "OKÄND") {
    return okandaVisible;
  }


  // ================================
  // ALLA ANDRA STATUSER
  // FÖLJER BUNKERTYPEN
  // ================================

  return bunkerTypeVisibility[typ] !== false;
}


/* =========================================================
   UPPDATERA ALLA BUNKRAR
   ========================================================= */

function uppdateraBunkrar() {

  if (!bunkerDataLoaded) {
    return;
  }

  bunkerFeatures.forEach(item => {

    const skaVisas =
      shouldShowBunker(item.feature);

    if (skaVisas) {

      if (!map.hasLayer(item.layer)) {
        item.layer.addTo(map);
      }

    }

    else {

      if (map.hasLayer(item.layer)) {
        map.removeLayer(item.layer);
      }

    }

  });

}


/* =========================================================
   SKAPA BUNKRAR
   ========================================================= */

fetch("data/BunkerLayer.geojson")
.then(res => {

  if (!res.ok) {
    throw new Error(`HTTP ${res.status}`);
  }

  return res.json();

})
.then(data => {


  /* -----------------------------------------
     Hitta alla bunkertyper
     ----------------------------------------- */

  data.features.forEach(feature => {

    const typ =
      feature.properties?.Typ;

    if (!typ) {
      return;
    }

    if (
      bunkerTypeVisibility[typ] === undefined
    ) {

      bunkerTypeVisibility[typ] = true;

    }

  });


  /* -----------------------------------------
     Skapa ett individuellt Leaflet-lager
     för varje bunker
     ----------------------------------------- */

  data.features.forEach(feature => {

    const typ =
      feature.properties?.Typ || "";

    const layer =
      L.geoJSON(feature, {

        pointToLayer:
          (feature, latlng) => {

            const icon =
              bunkerIcons[typ];

            if (icon) {

              return L.marker(
                latlng,
                {
                  icon: icon
                }
              );

            }

            return L.marker(latlng);

          },


        onEachFeature:
          (feature, layer) => {

            const p =
              feature.properties || {};


            const hasImage =
              p.Bild &&
              p.Bild !== "-" &&
              p.Bild.trim() !== "";


            const hasModel =
              p.Modell &&
              p.Modell !== "-" &&
              p.Modell.trim() !== "";


            const popup = `

              <div class="popup-content">

                <b>Typ:</b>
                ${p.Typ || ""}
                <br>

                <b>Nr:</b>
                ${p.Nr || ""}
                <br>

                <b>Tillgänglighet:</b>
                ${p["Tillgänglighet"] || ""}
                <br>

                <b>Parkering:</b>
                ${p.Parkering || ""}
                <br>

                <b>Mindre kuriosa:</b>
                ${p["Mindre kuriosa"] || ""}
                <br>

                <b>Status:</b>
                ${p.Status || p.STATUS || ""}
                <br>

                <b>Plomberad:</b>
                ${p.Plomberad || ""}
                <br>

                <b>Besökt:</b>
                ${p["Besökt"] || ""}
                <br>

                <b>Övrigt:</b>
                ${p["Övrigt"] || ""}
                <br>


                ${
                  hasImage

                  ? `

                    <a
                      href="${p.Bild}"
                      target="_blank"
                    >

                      <img
                        src="${p.Bild}"
                        alt="Bild ${p.Nr || ""}"
                        style="
                          width:280px;
                          height:auto;
                          border-radius:6px;
                          cursor:zoom-in;
                        "
                      >

                    </a>

                    <br>

                  `

                  :

                  `<i>📷 Bild saknas</i><br>`

                }


                ${
                  hasModel

                  ? `

                    <br>

                    <a
                      href="${p.Modell}"
                      target="_blank"
                    >
                      🔗 Visa 3D-modell
                    </a>

                  `

                  :

                  ""

                }

              </div>

            `;


            layer.bindPopup(
              popup,
              {
                maxWidth: 400,
                minWidth: 350
              }
            );

          }

      });


    bunkerFeatures.push({

      feature: feature,

      typ: typ,

      layer: layer

    });

  });


  bunkerDataLoaded = true;


  skapaBunkerFilter();


  uppdateraBunkrar();


  console.log(
    "Bunkrar laddade:",
    data.features.length,
    "features"
  );

})
.catch(err => {

  console.error(
    "Misslyckades med att ladda BunkerLayer:",
    err
  );

});


/* =========================================================
   SKAPA BUNKERTYPSFILTER
   ========================================================= */

function skapaBunkerFilter() {

  const container =
    document.getElementById(
      "bunker-type-filters"
    );

  if (!container) {
    return;
  }


  container.innerHTML = "";


  Object.keys(
    bunkerTypeVisibility
  )
  .sort()
  .forEach(typ => {


    bunkerTypeVisibility[typ] = true;


    const label =
      document.createElement("label");

    label.className =
      "filter-option";


    const checkbox =
      document.createElement("input");

    checkbox.type =
      "checkbox";

    checkbox.checked =
      true;


    checkbox.addEventListener(
      "change",
      function() {

        bunkerTypeVisibility[typ] =
          checkbox.checked;

        uppdateraBunkrar();

      }
    );


    label.appendChild(
      checkbox
    );


    /*
       SVG framför bunkertypen
    */

    if (bunkerIcons[typ]) {

      const img =
        document.createElement("img");

      img.src =
        bunkerIcons[typ]
          .options
          .iconUrl;

      img.alt = "";

      label.appendChild(
        img
      );

    }


    const text =
      document.createElement("span");

    text.textContent =
      typ;

    label.appendChild(
      text
    );


    container.appendChild(
      label
    );

  });

}


/* =========================================================
   FILTERMENY
   ========================================================= */

const filterControl =
  L.control({
    position: "topright"
  });


filterControl.onAdd =
  function(map) {

    const div =
      L.DomUtil.create(
        "div",
        "filter-control"
      );


    div.innerHTML = `

      <div
        class="filter-header"
        id="filter-main-toggle"
      >
        ☰ Karta
      </div>


      <div
        class="filter-body"
        id="filter-main-body"
      >


        <!-- KARTUNDERLAG -->

        <div class="filter-section">

          <div
            class="filter-section-title"
            data-section="basemap"
          >
            🗺️ Kartunderlag
          </div>

          <div
            class="filter-section-content"
            id="section-basemap"
          >

            <label class="filter-option">

              <input
                type="radio"
                name="basemap"
                checked
                id="osm-radio"
              >

              OpenStreetMap

            </label>


            <label class="filter-option">

              <input
                type="radio"
                name="basemap"
                id="sat-radio"
              >

              Satellit (ESRI)

            </label>


            <label class="filter-option">

              <input
                type="checkbox"
                id="ortho-check"
              >

              Ortofoto

            </label>

          </div>

        </div>


        <!-- DRÖNARE -->

        <div class="filter-section">

          <div
            class="filter-section-title"
            data-section="drone"
          >
            🚁 Drönarrestriktioner
          </div>

          <div
            class="filter-section-content"
            id="section-drone"
          >

            <label class="filter-option">

              <input
                type="checkbox"
                id="drone-red"
              >

              🔴 Tillstånd krävs

            </label>


            <label class="filter-option">

              <input
                type="checkbox"
                id="drone-orange"
              >

              🟠 Begränsad

            </label>

          </div>

        </div>


        <!-- DRAKTÄNDER -->

        <div class="filter-section">

          <div
            class="filter-section-title"
            data-section="draktander"
          >
            🧱 Draktänder
          </div>


          <div
            class="filter-section-content"
            id="section-draktander"
          >

            <label class="filter-option">

              <input
                type="checkbox"
                id="draktander-riven"
              >

              🔴 Rivna

            </label>


            <label class="filter-option">

              <input
                type="checkbox"
                id="draktander-kvar"
                checked
              >

              🟢 Kvar

            </label>


            <label class="filter-option">

              <input
                type="checkbox"
                id="draktander-bevarad"
                checked
              >

              🟠 Bevarade/flyttade

            </label>

          </div>

        </div>


        <!-- BUNKRAR -->

        <div class="filter-section">

          <div
            class="filter-section-title"
            data-section="bunkrar"
          >
            🏰 Bunkrar / värn
          </div>


          <div
            class="filter-section-content"
            id="section-bunkrar"
          >

            <div
              id="bunker-type-filters"
            ></div>


            <div class="filter-divider"></div>


            <div class="filter-subtitle">
              Status
            </div>


            <label class="filter-option">

              <input
                type="checkbox"
                id="status-rivet"
              >

              🔴 Rivna värn

            </label>


            <label class="filter-option">

              <input
                type="checkbox"
                id="status-provisoriskt"
              >

              🟠 Provisoriska värn

            </label>


            <label class="filter-option">

              <input
                type="checkbox"
                id="status-okand"
              >

              ⚫ Okända värn

            </label>

          </div>

        </div>

      </div>
    `;


    /* -----------------------------------------
       Förhindra att kartan reagerar
       ----------------------------------------- */

    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.disableScrollPropagation(div);


    /* -----------------------------------------
       Huvudmeny
       ----------------------------------------- */

    const mainToggle =
      div.querySelector(
        "#filter-main-toggle"
      );

    const mainBody =
      div.querySelector(
        "#filter-main-body"
      );


    mainToggle.addEventListener(
      "click",
      function() {

        if (
          mainBody.style.display ===
          "block"
        ) {

          mainBody.style.display =
            "none";

        }

        else {

          mainBody.style.display =
            "block";

        }

      }
    );


    /* -----------------------------------------
       Sektioner
       ----------------------------------------- */

    div.querySelectorAll(
      ".filter-section-title"
    ).forEach(title => {

      title.addEventListener(
        "click",
        function() {

          const section =
            title.parentElement;

          section.classList.toggle(
            "open"
          );

        }
      );

    });


    /* -----------------------------------------
       Kartunderlag
       ----------------------------------------- */

    div.querySelector(
      "#osm-radio"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          map.removeLayer(
            esriSat
          );

          osm.addTo(map);

        }

      }
    );


    div.querySelector(
      "#sat-radio"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          map.removeLayer(
            osm
          );

          esriSat.addTo(map);

        }

      }
    );


    div.querySelector(
      "#ortho-check"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          ortho.addTo(map);

        }

        else {

          map.removeLayer(
            ortho
          );

        }

      }
    );


    /* -----------------------------------------
       Drönare
       ----------------------------------------- */

    div.querySelector(
      "#drone-red"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          lfvNoFlyLayer.addTo(map);

        }

        else {

          map.removeLayer(
            lfvNoFlyLayer
          );

        }

      }
    );


    div.querySelector(
      "#drone-orange"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          lfvRestrictedLayer.addTo(map);

        }

        else {

          map.removeLayer(
            lfvRestrictedLayer
          );

        }

      }
    );


    /* -----------------------------------------
       Draktänder
       ----------------------------------------- */

    div.querySelector(
      "#draktander-riven"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          draktanderRivenLayer
            .addTo(map);

        }

        else {

          map.removeLayer(
            draktanderRivenLayer
          );

        }

      }
    );


    div.querySelector(
      "#draktander-kvar"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          draktanderKvarLayer
            .addTo(map);

        }

        else {

          map.removeLayer(
            draktanderKvarLayer
          );

        }

      }
    );


    div.querySelector(
      "#draktander-bevarad"
    ).addEventListener(
      "change",
      function() {

        if (this.checked) {

          draktanderBevaradLayer
            .addTo(map);

        }

        else {

          map.removeLayer(
            draktanderBevaradLayer
          );

        }

      }
    );


    /* -----------------------------------------
       STATUSFILTER BUNKRAR
       ----------------------------------------- */

    div.querySelector(
      "#status-rivet"
    ).addEventListener(
      "change",
      function() {

        rivnaVisible =
          this.checked;

        uppdateraBunkrar();

      }
    );


    div.querySelector(
      "#status-provisoriskt"
    ).addEventListener(
      "change",
      function() {

        provisoriskaVisible =
          this.checked;

        uppdateraBunkrar();

      }
    );


    div.querySelector(
      "#status-okand"
    ).addEventListener(
      "change",
      function() {

        okandaVisible =
          this.checked;

        uppdateraBunkrar();

      }
    );


    return div;

  };


filterControl.addTo(map);


/* =========================================================
   LFV DATA
   ========================================================= */

fetch("data/lfv_dronarkarta.geojson")
.then(res => {

  if (!res.ok) {
    throw new Error(
      `HTTP ${res.status}`
    );
  }

  return res.json();

})
.then(data => {

  L.geoJSON(data, {

    style: function(feature) {

      const farg =
        feature.properties?.Färg;


      if (farg === "RÖD") {

        return {

          color: "#d00000",
          weight: 3,
          fillColor: "#d00000",
          fillOpacity: 0.08

        };

      }


      if (farg === "ORANGE") {

        return {

          color: "#ff8800",
          weight: 3,
          fillColor: "#ff8800",
          fillOpacity: 0.08

        };

      }


      return {

        color: "#888888",
        weight: 2,
        fillOpacity: 0

      };

    },


    onEachFeature:
      function(feature, layer) {

        const p =
          feature.properties || {};


        const popup = `

          <div class="popup-content">

            <b>Område:</b>
            ${p.NAMEOFAREA || "-"}
            <br>

            <b>Typ:</b>
            ${p.TYPEOFAREA || "-"}
            <br>

            <b>Plats:</b>
            ${p.LOCATION || "-"}
            <br>

            <b>Undre gräns:</b>
            ${p.LOWER || "-"}
            <br>

            <b>Övre gräns:</b>
            ${p.UPPER || "-"}
            <br>

            <b>Gäller från:</b>
            ${p.WEF || "-"}
            <br>

            <b>Klass:</b>
            ${p.Färg || "-"}

          </div>

        `;


        layer.bindPopup(
          popup
        );


        if (
          p.Färg === "RÖD"
        ) {

          lfvNoFlyLayer
            .addLayer(layer);

        }


        if (
          p.Färg === "ORANGE"
        ) {

          lfvRestrictedLayer
            .addLayer(layer);

        }

      }

  });


  console.log(
    "LFV GeoJSON laddat:",
    data.features.length,
    "features"
  );

})
.catch(err => {

  console.error(
    "Misslyckades med LFV GeoJSON:",
    err
  );

});


/* =========================================================
   GPS
   ========================================================= */

if (navigator.geolocation) {

  navigator.geolocation.watchPosition(

    function(position) {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      L.circleMarker(
        [lat,lng],
        {

          radius: 8,
          color: "#ff8800",
          fillColor: "#ff8800",
          fillOpacity: 0.9

        }

      )

      .addTo(map)

      .bindPopup(

        `Din position:<br>
         Lat: ${lat.toFixed(6)},
         Lng: ${lng.toFixed(6)}`

      );

    },


    function(error) {

      console.warn(
        "Geolocation misslyckades:",
        error.message
      );

    },


    {

      enableHighAccuracy: true,
      maximumAge: 10000,
      timeout: 5000

    }

  );

}

</script>

</body>
</html>
